<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>PricePilot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#4cd472">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PricePilot">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #4cd472;
      --green-dark: #27ae60;
      --red: #e8645a;
      --red-dark: #c0392b;
      --neutral: #f5f3ef;
      --ink: #1a1814;
      --muted: #7c756d;
      --line: #e2ddd8;
      --mono: 'DM Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--neutral);
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── PAGES ── */
    .brand-header {
      padding: 12px 16px 10px;
      background: var(--neutral);
      border-bottom: 1px solid var(--line);
    }

    .brand-kicker {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .brand-title {
      color: var(--ink);
      font-size: 25px;
      line-height: 1;
      margin-top: 2px;
    }

    .brand-subtitle {
      color: #4c473f;
      font-size: 13px;
      line-height: 1.35;
      margin-top: 5px;
    }

    .install-card {
      display: none;
      margin: 8px 12px 0;
      padding: 8px 10px;
      background: rgba(255,255,255,0.72);
      border: 1px solid rgba(226,221,216,0.9);
      border-radius: 7px;
      color: var(--ink);
    }

    .install-card.show { display: block; }

    .install-card-title {
      font-size: 13px;
      font-weight: 700;
    }

    .install-card-text {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      margin-top: 2px;
    }

    .install-card .actions {
      margin-top: 7px;
    }

    .install-card .btn-primary {
      min-height: 34px;
      padding: 7px 10px;
      font-size: 13px;
    }

    .page { display: flex; flex-direction: column; flex: 1; }
    .page.hidden { display: none !important; }

    /* ══ SIMPLE MODE ══ */
    #simple-mode {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .split-wrap {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      position: relative;
      min-height: clamp(360px, calc(100vh - 300px), 470px);
    }

    .side {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 14px 8px 18px;
      gap: 8px;
      transition: background 0.3s;
      min-width: 0;
    }

    .side.side-a { background: #c8c8c8; }
    .side.side-b { background: #c8c8c8; }
    .side.winner { background: var(--green); }
    .side.loser  { background: var(--red); }
    .side.neutral-a { background: #d0ceca; }
    .side.neutral-b { background: #bfbdba; }

    /* circle result */
    .circle-wrap {
      position: relative;
      width: 88px;
      height: 88px;
      flex-shrink: 0;
    }

    .circle-svg {
      width: 88px;
      height: 88px;
      transform: rotate(-90deg);
    }

    .circle-bg { fill: none; stroke: rgba(255,255,255,0.25); stroke-width: 7; }
    .circle-fg { fill: none; stroke: white; stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset 0.5s ease; }

    .circle-inner {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .circle-pct {
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 500;
      line-height: 1;
    }

    .circle-label {
      font-size: 13px;
      font-weight: 700;
      margin-top: 3px;
      letter-spacing: 0.04em;
    }

    .unit-price-display {
      font-family: var(--mono);
      font-size: 16px;
      color: white;
      font-weight: 500;
      text-align: center;
      min-height: 22px;
    }

    /* inputs */
    .input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .input-row label {
      font-size: 15px;
      color: rgba(255,255,255,0.85);
      white-space: nowrap;
      font-weight: 500;
      width: 38px;
    }

    .input-row input {
      flex: 1;
      font-family: var(--mono);
      font-size: 17px;
      padding: 9px 8px;
      border: none;
      border-radius: 10px;
      background: rgba(255,255,255,0.9);
      color: #1a1814;
      -moz-appearance: textfield;
      appearance: textfield;
      min-width: 0;
    }

    .input-row.name-row input {
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 16px;
    }

    .input-row input::-webkit-outer-spin-button,
    .input-row input::-webkit-inner-spin-button { -webkit-appearance: none; }

    .input-row input:focus { outline: 2px solid white; }

    .unit-select {
      width: 100%;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 15px;
      padding: 9px 10px;
      border: none;
      border-radius: 10px;
      background: rgba(255,255,255,0.2);
      color: white;
      appearance: none;
      text-align: center;
      cursor: pointer;
    }

    .unit-select option { color: #1a1814; background: white; }

    .result-panel {
      background: white;
      border-top: 1px solid var(--line);
      padding: 11px 14px 12px;
    }

    .result-title {
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
      min-height: 21px;
    }

    .result-detail {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      margin-top: 3px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 9px;
    }

    .btn-primary,
    .btn-secondary,
    .btn-add,
    .btn-clear {
      min-height: 44px;
    }

    .btn-primary,
    .btn-secondary {
      border-radius: 8px;
      padding: 10px 13px;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-primary {
      flex: 1;
      background: var(--ink);
      color: white;
      border: none;
    }

    .btn-secondary {
      background: white;
      color: var(--muted);
      border: 1px solid var(--line);
    }

    /* middle circle badge */
    .mid-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .mid-badge .mid-pct {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 500;
      color: #1a1814;
      line-height: 1;
    }

    .mid-badge .mid-label {
      font-size: 9px;
      color: #8a857e;
      margin-top: 2px;
    }

    /* ══ MULTI MODE ══ */
    #multi-mode {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 12px;
    }

    .multi-toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .btn-add {
      background: #1a1814;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 11px 16px;
      font-size: 15px;
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-clear {
      background: white;
      color: #8a857e;
      border: 1px solid #e2ddd8;
      border-radius: 8px;
      padding: 11px 16px;
      font-size: 15px;
      font-family: 'Noto Sans TC', sans-serif;
      cursor: pointer;
    }

    .table-wrap {
      background: white;
      border: 1px solid #e2ddd8;
      border-radius: 14px;
      overflow-x: auto;
      flex-shrink: 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
    }

    thead th {
      background: #f5f3ef;
      color: #8a857e;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid #e2ddd8;
      white-space: nowrap;
    }

    tbody tr { border-bottom: 1px solid #e2ddd8; transition: background 0.2s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr.winner { background: #d4f0df; }
    tbody tr.loser  { background: #fad8d8; }

    tbody td { padding: 9px 10px; vertical-align: middle; }

    tbody td input, tbody td select {
      width: 100%;
      font-family: var(--mono);
      font-size: 15px;
      border: 1px solid #e2ddd8;
      border-radius: 6px;
      padding: 8px 8px;
      background: rgba(255,255,255,0.7);
      color: #1a1814;
      -moz-appearance: textfield;
      appearance: textfield;
    }

    tbody td input::-webkit-outer-spin-button,
    tbody td input::-webkit-inner-spin-button { -webkit-appearance: none; }
    tbody td input:focus, tbody td select:focus { outline: none; border-color: #1a1814; }

    .col-letter { width: 32px; text-align: center; }
    .letter-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; border-radius: 50%;
      background: #e2ddd8; color: #1a1814;
      font-size: 13px; font-weight: 700;
    }
    .winner .letter-badge { background: var(--green-dark); color: white; }
    .loser  .letter-badge { background: #e74c3c; color: white; }
    .col-name  { min-width: 112px; }
    .col-price { min-width: 68px; }
    .col-qty   { min-width: 56px; }
    .col-unit  { min-width: 78px; }
    .col-up    { min-width: 84px; font-family: var(--mono); font-size: 12px; white-space: nowrap; }
    .col-rank  { min-width: 70px; text-align: center; }
    .col-del   { width: 28px; text-align: center; }

    .winner .col-up { color: #155c33; font-weight: 500; }
    .loser  .col-up { color: #7a1f1f; font-weight: 500; }

    .rank-badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 24px; height: 24px; border-radius: 999px;
      padding: 0 8px;
      font-size: 12px; font-weight: 700;
      white-space: nowrap;
    }
    .rank-1 { background: #f5c518; color: #5a4200; }
    .rank-2 { background: #c0c8d0; color: #3a3a3a; }
    .rank-3 { background: #d4a97a; color: #5a3800; }
    .rank-n { background: #e2ddd8; color: #8a857e; }

    .del-btn {
      background: none; border: none; cursor: pointer;
      color: #8a857e; font-size: 17px; padding: 2px 4px; line-height: 1;
    }
    .del-btn:hover { color: #e74c3c; }

    .history {
      margin: 0;
      padding: 0 12px 68px;
      background: var(--neutral);
      border-top: 1px solid var(--line);
    }

    .history-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 45px;
      color: var(--ink);
      cursor: pointer;
      list-style: none;
    }

    .history-summary::-webkit-details-marker {
      display: none;
    }

    .history-title {
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
    }

    .history-count {
      color: var(--muted);
      font-size: 12px;
    }

    .history[open] .history-summary {
      border-bottom: 1px solid var(--line);
      margin-bottom: 8px;
    }

    .history-tools {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 8px;
    }

    .history-tools .btn-secondary {
      min-height: 34px;
      padding: 7px 10px;
      font-size: 13px;
    }

    .history-list {
      display: grid;
      gap: 8px;
      padding-bottom: 10px;
    }

    .history-empty,
    .history-item {
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }

    .history-empty {
      color: var(--muted);
      font-size: 13px;
    }

    .history-item-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
    }

    .history-item-detail {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.5;
      margin-top: 6px;
      white-space: pre-line;
    }

    .toast {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 72px;
      z-index: 20;
      display: none;
      padding: 12px 14px;
      border-radius: 8px;
      background: rgba(26,24,20,0.92);
      color: white;
      font-size: 14px;
      text-align: center;
    }

    .toast.show { display: block; }

    /* ── BOTTOM TABS ── */
    .bottom-tabs {
      background: white;
      border-top: 1px solid #e2ddd8;
      display: flex;
      flex-shrink: 0;
      padding-bottom: env(safe-area-inset-bottom);
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 15;
    }

    .tab-btn {
      flex: 1; padding: 13px 0 14px;
      border: none; background: none;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 14px; font-weight: 500;
      cursor: pointer; color: #8a857e;
      letter-spacing: 0.04em;
      transition: color 0.2s;
      position: relative;
    }

    .tab-btn.active { color: #1a1814; }

    .tab-btn.active::after {
      content: '';
      position: absolute;
      top: 0; left: 20%; right: 20%;
      height: 2px; background: #1a1814;
      border-radius: 0 0 2px 2px;
    }

    @media (min-width: 720px) {
      body {
        max-width: 720px;
        margin: 0 auto;
        border-left: 1px solid var(--line);
        border-right: 1px solid var(--line);
      }

      .bottom-tabs {
        left: 50%;
        right: auto;
        width: min(720px, 100%);
        transform: translateX(-50%);
      }
    }

    @media (max-width: 390px) {
      .brand-title { font-size: 23px; }
      .brand-subtitle { font-size: 12px; }
      .split-wrap { min-height: clamp(380px, calc(100vh - 285px), 500px); }
      .circle-wrap,
      .circle-svg {
        width: 76px;
        height: 76px;
      }
      .circle-pct { font-size: 19px; }
      .input-row {
        align-items: stretch;
        flex-direction: column;
        gap: 4px;
      }
      .input-row label { width: auto; font-size: 13px; }
    }
  </style>
</head>
<body>

<header class="brand-header">
  <div class="brand-kicker">Unit price comparer</div>
  <h1 class="brand-title">PricePilot</h1>
  <p class="brand-subtitle">智慧單價比較，幫你快速找出最划算的選擇</p>
</header>

<section class="install-card" id="install-card">
  <div class="install-card-title">把 PricePilot 加到主畫面</div>
  <p class="install-card-text" id="install-text">Android 可直接安裝；iPhone 可使用 Safari 分享按鈕，選擇「加入主畫面」。</p>
  <div class="actions" id="install-actions">
    <button class="btn-primary" id="install-btn" type="button">安裝 PricePilot</button>
  </div>
</section>

<!-- SIMPLE MODE -->
<div class="page" id="simple-mode">
  <div class="split-wrap">

    <div class="side side-a neutral-a" id="side-a">
      <div class="circle-wrap">
        <svg class="circle-svg" viewBox="0 0 110 110">
          <circle class="circle-bg" cx="55" cy="55" r="46"/>
          <circle class="circle-fg" id="fg-a" cx="55" cy="55" r="46" stroke-dasharray="289" stroke-dashoffset="289"/>
        </svg>
        <div class="circle-inner">
          <div class="circle-pct" id="pct-a">—</div>
          <div class="circle-label" id="lbl-a"></div>
        </div>
      </div>
      <div class="unit-price-display" id="up-a">—</div>
      <div class="input-row name-row">
        <label>名稱</label>
        <input type="text" id="nameA" placeholder="商品 A" oninput="simpleCompare()">
      </div>
      <div class="input-row">
        <label>價格</label>
        <input type="number" id="priceA" min="0" placeholder="0" oninput="simpleCompare()">
      </div>
      <div class="input-row">
        <label>數量</label>
        <input type="number" id="qtyA" min="0" placeholder="0" oninput="simpleCompare()">
      </div>
      <select class="unit-select" id="unitA" onchange="simpleCompare()">
        <option value="0">件／個</option>
        <option value="1">克 (g)</option>
        <option value="2">毫升 (ml)</option>
        <option value="3">公斤 (kg)</option>
        <option value="4">公升 (L)</option>
      </select>
    </div>

    <div class="side side-b neutral-b" id="side-b">
      <div class="circle-wrap">
        <svg class="circle-svg" viewBox="0 0 110 110">
          <circle class="circle-bg" cx="55" cy="55" r="46"/>
          <circle class="circle-fg" id="fg-b" cx="55" cy="55" r="46" stroke-dasharray="289" stroke-dashoffset="289"/>
        </svg>
        <div class="circle-inner">
          <div class="circle-pct" id="pct-b">—</div>
          <div class="circle-label" id="lbl-b"></div>
        </div>
      </div>
      <div class="unit-price-display" id="up-b">—</div>
      <div class="input-row name-row">
        <label>名稱</label>
        <input type="text" id="nameB" placeholder="商品 B" oninput="simpleCompare()">
      </div>
      <div class="input-row">
        <label>價格</label>
        <input type="number" id="priceB" min="0" placeholder="0" oninput="simpleCompare()">
      </div>
      <div class="input-row">
        <label>數量</label>
        <input type="number" id="qtyB" min="0" placeholder="0" oninput="simpleCompare()">
      </div>
      <select class="unit-select" id="unitB" onchange="simpleCompare()">
        <option value="0">件／個</option>
        <option value="1">克 (g)</option>
        <option value="2">毫升 (ml)</option>
        <option value="3">公斤 (kg)</option>
        <option value="4">公升 (L)</option>
      </select>
    </div>



  </div>
  <section class="result-panel">
    <div class="result-title" id="simple-result-title">輸入價格與數量後，立即比較哪個更划算</div>
    <div class="result-detail" id="simple-result-detail">支援件、克、毫升、公斤與公升。</div>
    <div class="actions">
      <button class="btn-primary" onclick="shareResult()">分享結果</button>
    </div>
  </section>
</div>

<!-- MULTI MODE -->
<div class="page hidden" id="multi-mode">
  <div class="multi-toolbar">
    <button class="btn-add" onclick="multiAdd()">＋ 新增商品</button>
    <button class="btn-clear" onclick="multiClear()">清除全部</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="col-letter"></th>
          <th class="col-name">商品名稱</th>
          <th class="col-price">價格</th>
          <th class="col-qty">數量</th>
          <th class="col-unit">單位</th>
          <th class="col-up">單價</th>
          <th class="col-rank">排名</th>
          <th class="col-del"></th>
        </tr>
      </thead>
      <tbody id="multi-tbody"></tbody>
    </table>
  </div>
  <section class="result-panel">
    <div class="result-title" id="multi-result-title">輸入兩項以上商品後，會自動排出最划算選擇</div>
    <div class="result-detail" id="multi-result-detail">第一名會標示為最划算。</div>
    <div class="actions">
      <button class="btn-primary" onclick="shareResult()">分享結果</button>
    </div>
  </section>
</div>

<details class="history" id="history-section">
  <summary class="history-summary">
    <span class="history-title">最近比較紀錄</span>
    <span class="history-count" id="history-count">0 筆</span>
  </summary>
  <div class="history-tools">
    <button class="btn-secondary" onclick="clearHistory()" type="button">清除紀錄</button>
  </div>
  <div class="history-list" id="history-list"></div>
</details>

<div class="toast" id="toast"></div>

<!-- BOTTOM TABS -->
<div class="bottom-tabs">
  <button class="tab-btn active" id="tab-simple" onclick="switchTab('simple')">簡單</button>
  <button class="tab-btn" id="tab-multi" onclick="switchTab('multi')">多項</button>
</div>

<script>
  const UNITS = [
    { label: '件／個', per: null, short: '件' },
    { label: '克 (g)',  per: 100,  short: 'g'  },
    { label: '毫升 (ml)', per: 100, short: 'ml' },
    { label: '公斤 (kg)', per: 1000, short: 'kg' },
    { label: '公升 (L)', per: 1000, short: 'L'  },
  ];

  const CIRC = 2 * Math.PI * 46;
  const HISTORY_KEY = 'pricepilot-history-v1';
  let lastComparison = null;
  let lastHistorySignature = '';
  let historyTimer = null;
  let deferredInstallPrompt = null;

  function switchTab(mode) {
    document.getElementById('simple-mode').classList.toggle('hidden', mode !== 'simple');
    document.getElementById('multi-mode').classList.toggle('hidden', mode !== 'multi');
    document.getElementById('tab-simple').classList.toggle('active', mode === 'simple');
    document.getElementById('tab-multi').classList.toggle('active', mode === 'multi');
    if (mode === 'simple') simpleCompare();
    if (mode === 'multi') multiCompare();
  }

  function setCircle(fgId, pct) {
    const fg = document.getElementById(fgId);
    const offset = CIRC - (pct / 100) * CIRC;
    fg.style.strokeDashoffset = offset;
  }

  function getSimpleName(letter) {
    const value = document.getElementById('name' + letter).value.trim();
    return value || letter;
  }

  function fallbackName(value, idx) {
    const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    return (value || '').trim() || (letters[idx] || String(idx + 1));
  }

  function formatUnitPrice(unitPrice, unit) {
    return unitPrice.toFixed(3) + ' 元/' + unit.short;
  }

  function formatTime(timestamp) {
    return new Date(timestamp).toLocaleString('zh-TW', {
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit'
    });
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, char => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#039;'
    }[char]));
  }

  function escapeAttr(value) {
    return escapeHtml(value);
  }

  function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');
    window.clearTimeout(showToast.timer);
    showToast.timer = window.setTimeout(() => toast.classList.remove('show'), 2200);
  }

  function getHistory() {
    try {
      return JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
    } catch {
      return [];
    }
  }

  function setHistory(items) {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(items.slice(0, 5)));
    renderHistory();
  }

  function scheduleHistorySave(comparison) {
    const signature = JSON.stringify({
      mode: comparison.mode,
      items: comparison.items.map(item => [item.name, item.unitPrice.toFixed(3), item.rank])
    });
    if (signature === lastHistorySignature) return;

    window.clearTimeout(historyTimer);
    historyTimer = window.setTimeout(() => {
      const history = getHistory();
      setHistory([{ ...comparison, createdAt: Date.now() }, ...history].slice(0, 5));
      lastHistorySignature = signature;
    }, 650);
  }

  function renderHistory() {
    const list = document.getElementById('history-list');
    const count = document.getElementById('history-count');
    const history = getHistory();
    if (count) count.textContent = `${history.length} 筆`;

    if (!history.length) {
      list.innerHTML = '<div class="history-empty">完成比較後，這裡會保留最近 5 筆紀錄。</div>';
      return;
    }

    list.innerHTML = history.map(record => {
      const topItems = record.items
        .slice()
        .sort((a, b) => a.rank - b.rank)
        .map(item => `${item.rank}. ${item.name} ${item.unitPriceText}`)
        .join('\n');
      return `
        <article class="history-item">
          <div class="history-item-top">
            <span>${escapeHtml(record.title)}</span>
            <time>${formatTime(record.createdAt)}</time>
          </div>
          <div class="history-item-detail">${escapeHtml(topItems)}</div>
        </article>
      `;
    }).join('');
  }

  function clearHistory() {
    localStorage.removeItem(HISTORY_KEY);
    lastHistorySignature = '';
    renderHistory();
    showToast('已清除最近比較紀錄');
  }

  function buildShareText(comparison) {
    if (!comparison) return '';
    const lines = [
      'PricePilot 比較結果',
      comparison.title,
      ''
    ];
    comparison.items
      .slice()
      .sort((a, b) => a.rank - b.rank)
      .forEach(item => {
        lines.push(`${item.rank}. ${item.name}：${item.unitPriceText}${item.rank === 1 ? '（最划算）' : ''}`);
      });
    return lines.join('\n');
  }

  async function shareResult() {
    if (!lastComparison) {
      showToast('請先完成一組比較');
      return;
    }

    const text = buildShareText(lastComparison);
    try {
      if (navigator.share) {
        await navigator.share({ title: 'PricePilot 比較結果', text });
        return;
      }
      await navigator.clipboard.writeText(text);
      showToast('瀏覽器不支援直接分享，已複製結果');
    } catch {
    showToast('分享未完成，請再試一次');
    }
  }

  function isStandaloneApp() {
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  }

  function setupInstallPrompt() {
    const card = document.getElementById('install-card');
    const text = document.getElementById('install-text');
    const actions = document.getElementById('install-actions');
    const button = document.getElementById('install-btn');

    if (isStandaloneApp()) return;

    card.classList.add('show');
    actions.style.display = 'none';

    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      deferredInstallPrompt = event;
      text.textContent = '可以把 PricePilot 安裝到手機主畫面，之後像 App 一樣開啟。';
      actions.style.display = 'flex';
    });

    button.addEventListener('click', async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      actions.style.display = 'none';
    });

    window.addEventListener('appinstalled', () => {
      card.classList.remove('show');
      showToast('PricePilot 已加入主畫面');
    });
  }

  function registerServiceWorker() {
    if (!('serviceWorker' in navigator)) return;
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  function simpleCompare() {
    const sides = ['A','B'];
    const vals = sides.map(s => {
      const price = parseFloat(document.getElementById('price'+s).value);
      const qty   = parseFloat(document.getElementById('qty'+s).value);
      const uIdx  = parseInt(document.getElementById('unit'+s).value);
      const u     = UNITS[uIdx];
      if (!isNaN(price) && !isNaN(qty) && qty > 0 && price > 0)
        return { valid: true, unitPrice: price/qty, u, name: getSimpleName(s) };
      return { valid: false };
    });

    const bothValid = vals[0].valid && vals[1].valid;
    const titleEl = document.getElementById('simple-result-title');
    const detailEl = document.getElementById('simple-result-detail');
    lastComparison = null;

    // reset
    ['a','b'].forEach(s => {
      document.getElementById('side-'+s).className = 'side side-'+s + (s==='a' ? ' neutral-a' : ' neutral-b');
      document.getElementById('pct-'+s).textContent = '—';
      document.getElementById('lbl-'+s).textContent = '';
      document.getElementById('up-'+s).textContent = '—';
      setCircle('fg-'+s, 0);
    });


    vals.forEach((v, i) => {
      const s = i === 0 ? 'a' : 'b';
      const u = UNITS[parseInt(document.getElementById('unit' + (i===0?'A':'B')).value)];
      if (!v.valid) return;
      document.getElementById('up-'+s).textContent = formatUnitPrice(v.unitPrice, u);
    });

    if (!bothValid) {
      titleEl.textContent = '輸入價格與數量後，立即比較哪個更划算';
      detailEl.textContent = '支援件、克、毫升、公斤與公升。';
      return;
    }

    const upA = vals[0].unitPrice;
    const upB = vals[1].unitPrice;
    const tie = upA === upB;
    const nameA = vals[0].name;
    const nameB = vals[1].name;

    if (tie) {
      document.getElementById('pct-a').textContent = '=';
      document.getElementById('pct-b').textContent = '=';
      document.getElementById('lbl-a').textContent = '相同';
      document.getElementById('lbl-b').textContent = '相同';
      titleEl.textContent = `${nameA} 和 ${nameB} 單價相同`;
      detailEl.textContent = `${nameA}：${formatUnitPrice(upA, vals[0].u)}，${nameB}：${formatUnitPrice(upB, vals[1].u)}`;

      setCircle('fg-a', 100);
      setCircle('fg-b', 100);
      lastComparison = {
        mode: 'simple',
        title: `${nameA} 和 ${nameB} 單價相同`,
        items: [
          { name: nameA, unitPrice: upA, unitPriceText: formatUnitPrice(upA, vals[0].u), rank: 1 },
          { name: nameB, unitPrice: upB, unitPriceText: formatUnitPrice(upB, vals[1].u), rank: 1 }
        ]
      };
      scheduleHistorySave(lastComparison);
      return;
    }

    const winner = upA < upB ? 'a' : 'b';
    const loser  = winner === 'a' ? 'b' : 'a';
    const winPrice = Math.min(upA, upB);
    const losePrice = Math.max(upA, upB);
    const diffPct = Math.round((losePrice - winPrice) / losePrice * 100);
    const fillPct = Math.min(100, Math.round((winPrice / losePrice) * 100));

    document.getElementById('side-'+winner).className = 'side side-'+winner+' winner';
    document.getElementById('side-'+loser).className  = 'side side-'+loser+' loser';

    document.getElementById('pct-'+winner).textContent = diffPct + '%';
    document.getElementById('lbl-'+winner).textContent = '更划算';
    document.getElementById('pct-'+loser).textContent  = diffPct + '%';
    document.getElementById('lbl-'+loser).textContent  = '較貴';

    setCircle('fg-'+winner, 100);
    setCircle('fg-'+loser, fillPct);

    const winnerIdx = winner === 'a' ? 0 : 1;
    const loserIdx = loser === 'a' ? 0 : 1;
    const winnerName = vals[winnerIdx].name;
    const loserName = vals[loserIdx].name;
    titleEl.textContent = `${winnerName} 比 ${loserName} 便宜 ${diffPct}%`;
    detailEl.textContent = `${loserName} 比 ${winnerName} 貴 ${diffPct}%`;
    lastComparison = {
      mode: 'simple',
      title: `${winnerName} 比 ${loserName} 便宜 ${diffPct}%`,
      items: [
        {
          name: winnerName,
          unitPrice: vals[winnerIdx].unitPrice,
          unitPriceText: formatUnitPrice(vals[winnerIdx].unitPrice, vals[winnerIdx].u),
          rank: 1
        },
        {
          name: loserName,
          unitPrice: vals[loserIdx].unitPrice,
          unitPriceText: formatUnitPrice(vals[loserIdx].unitPrice, vals[loserIdx].u),
          rank: 2
        }
      ]
    };
    scheduleHistorySave(lastComparison);

  }

  /* ── MULTI ── */
  let multiRows = [
    { id: 1, name: '' },
    { id: 2, name: '' },
    { id: 3, name: '' },
  ];
  let nextMultiId = 4;

  function captureMultiInputs() {
    multiRows.forEach(r => {
      const name = document.getElementById('m-name-' + r.id);
      const price = document.getElementById('m-price-' + r.id);
      const qty = document.getElementById('m-qty-' + r.id);
      const unit = document.getElementById('m-unit-' + r.id);
      if (name) r.name = name.value;
      if (price) r.price = price.value;
      if (qty) r.qty = qty.value;
      if (unit) r.unitIdx = unit.value;
    });
  }

  function renderMulti() {
    const tbody = document.getElementById('multi-tbody');
    tbody.innerHTML = '';
    const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    multiRows.forEach((r, idx) => {
      const tr = document.createElement('tr');
      tr.id = 'mrow-' + r.id;
      tr.innerHTML = `
        <td class="col-letter"><span class="letter-badge">${letters[idx] || idx+1}</span></td>
        <td class="col-name"><input type="text" id="m-name-${r.id}" value="${escapeAttr(r.name || '')}" placeholder="商品 ${letters[idx] || idx+1}" oninput="updateMultiName(${r.id}, this.value); multiCompare()"></td>
        <td class="col-price"><input type="number" id="m-price-${r.id}" min="0" placeholder="0" value="${escapeAttr(r.price || '')}" oninput="multiCompare()"></td>
        <td class="col-qty"><input type="number" id="m-qty-${r.id}" min="0" placeholder="0" value="${escapeAttr(r.qty || '')}" oninput="multiCompare()"></td>
        <td class="col-unit">
          <select id="m-unit-${r.id}" onchange="multiCompare()">
            ${UNITS.map((u,i)=>`<option value="${i}" ${String(r.unitIdx ?? 0) === String(i) ? 'selected' : ''}>${u.label}</option>`).join('')}
          </select>
        </td>
        <td class="col-up" id="m-up-${r.id}">—</td>
        <td class="col-rank" id="m-rank-${r.id}"><span class="rank-badge rank-n">—</span></td>
        <td class="col-del">${multiRows.length > 2 ? `<button class="del-btn" onclick="multiRemove(${r.id})">×</button>` : ''}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function updateMultiName(id, val) {
    const row = multiRows.find(r => r.id === id);
    if (row) row.name = val;
  }

  function multiCompare() {
    captureMultiInputs();
    const results = multiRows.map((r, idx) => {
      const price = parseFloat(document.getElementById('m-price-'+r.id)?.value);
      const qty   = parseFloat(document.getElementById('m-qty-'+r.id)?.value);
      const uIdx  = parseInt(document.getElementById('m-unit-'+r.id)?.value ?? 0);
      const u     = UNITS[uIdx];
      if (!isNaN(price) && !isNaN(qty) && qty > 0 && price > 0)
        return { id: r.id, valid: true, unitPrice: price/qty, u, name: fallbackName(r.name, idx) };
      return { id: r.id, valid: false, name: fallbackName(r.name, idx) };
    });

    const valid = results.filter(r => r.valid).sort((a,b) => a.unitPrice - b.unitPrice);
    const titleEl = document.getElementById('multi-result-title');
    const detailEl = document.getElementById('multi-result-detail');
    lastComparison = null;

    results.forEach(r => {
      const upCell   = document.getElementById('m-up-'+r.id);
      const rankCell = document.getElementById('m-rank-'+r.id);
      const row      = document.getElementById('mrow-'+r.id);
      row.classList.remove('winner','loser');

      if (!r.valid) {
        upCell.textContent = '—';
        rankCell.innerHTML = '<span class="rank-badge rank-n">—</span>';
        return;
      }

      const rankPos = valid.findIndex(v => v.id === r.id) + 1;
      upCell.textContent = formatUnitPrice(r.unitPrice, r.u);
      const cls = rankPos===1?'rank-1':rankPos===2?'rank-2':rankPos===3?'rank-3':'rank-n';
      rankCell.innerHTML = `<span class="rank-badge ${cls}">${rankPos === 1 ? '最划算' : rankPos}</span>`;
      if (valid.length > 1) {
        if (rankPos === 1) row.classList.add('winner');
        else row.classList.add('loser');
      }
    });

    if (valid.length < 2) {
      titleEl.textContent = '輸入兩項以上商品後，會自動排出最划算選擇';
      detailEl.textContent = '第一名會標示為最划算。';
      return;
    }

    const rankedItems = valid.map((item, idx) => ({
      name: item.name,
      unitPrice: item.unitPrice,
      unitPriceText: formatUnitPrice(item.unitPrice, item.u),
      rank: idx + 1
    }));
    const best = rankedItems[0];
    const second = rankedItems[1];
    const diffPct = Math.round((second.unitPrice - best.unitPrice) / second.unitPrice * 100);
    titleEl.textContent = `${best.name} 最划算，比第 2 名便宜 ${diffPct}%`;
    detailEl.textContent = rankedItems.map(item => `${item.rank}. ${item.name} ${item.unitPriceText}`).join('　');
    lastComparison = {
      mode: 'multi',
      title: `${best.name} 最划算`,
      items: rankedItems
    };
    scheduleHistorySave(lastComparison);
  }

  function multiAdd() {
    captureMultiInputs();
    multiRows.push({ id: nextMultiId, name: '' });
    nextMultiId++;
    renderMulti();
    multiCompare();
  }

  function multiRemove(id) {
    if (multiRows.length <= 2) return;
    captureMultiInputs();
    multiRows = multiRows.filter(r => r.id !== id);
    renderMulti();
    multiCompare();
  }

  function multiClear() {
    document.querySelectorAll('#multi-tbody input').forEach(i => i.value = '');
    multiRows.forEach(r => {
      r.name = '';
      r.price = '';
      r.qty = '';
    });
    multiCompare();
  }

  renderMulti();
  renderHistory();
  setupInstallPrompt();
  registerServiceWorker();
</script>
</body>
</html>
